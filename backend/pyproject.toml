[project]
name = "frogradar-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.152.0",
    "litellm>=1.106.0,!=1.82.7,!=1.82.8",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are generated; long column definitions are fine there.
"app/db/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real providers (cost money, need keys): run them explicitly with `-m live`.
addopts = "-m 'not live'"
markers = [
    "db: needs the docker Postgres (skipped if unreachable, unless REQUIRE_DB=1)",
    "live: calls real LLM providers; skipped unless selected with -m live",
]
filterwarnings = [
    # Noise from LiteLLM's own types on import.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]
