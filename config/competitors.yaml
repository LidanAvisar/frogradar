# DEMO SCOPE: the demo runs on 3 curated sources (Sonatype Blog, GitHub Changelog, The New Stack);
# every other source below has `is_active: false`. Nothing is deleted: to enable a source, set
# `is_active: true` (or remove the flag) and run `make seed`. See README "Demo scope".
#
# Companies FrogRadar tracks, their products, and where to watch them.
# Validated by app/core/catalog.py (CompetitorsFile). Loaded into the DB by `make seed`.
#
# relationship: self | competitor | partner | coopetition   (exactly one "self")
# segments:     artifact_management | supply_chain_security | mlops | cicd | distribution
# sources:      kind official|press|community|github, fetch_method rss|github|page_diff|web
#               trust_score optional (defaults: official 0.9, github 0.85, press 0.7, community 0.5)
#               is_active: false = keep the row but don't fetch it
#               github sources need options.repos: repos under the org whose releases we collect
#               (each checked on 2026-10-20 to publish releases)
#               rss sources may set options.keep_fragment: true when feed items are #anchors on one page
#
# Every URL below was checked on 2026-10-20 (HTTP 200; RSS URLs return a feed; GitHub orgs exist),
# except where marked "TODO verify".
# Aliases are used for entity linking: keep them specific. Broad names that would match unrelated
# news (e.g. "Amazon", "Microsoft", "Google") are deliberately left out.

companies:
  - slug: jfrog
    name: JFrog
    relationship: self
    aliases: [JFrog Ltd]
    segments: [artifact_management, supply_chain_security, mlops, cicd, distribution]
    website: https://jfrog.com
    products:
      - {slug: jfrog-artifactory, name: JFrog Artifactory, aliases: [Artifactory], segments: [artifact_management]}
      - {slug: jfrog-xray, name: JFrog Xray, aliases: [Xray], segments: [supply_chain_security]}
      - {slug: jfrog-curation, name: JFrog Curation, segments: [supply_chain_security]}
      - {slug: jfrog-advanced-security, name: JFrog Advanced Security, segments: [supply_chain_security]}
      - {slug: jfrog-ml, name: JFrog ML, aliases: [Qwak], segments: [mlops]}
      - {slug: jfrog-distribution, name: JFrog Distribution, segments: [distribution]}
      - {slug: jfrog-connect, name: JFrog Connect, segments: [distribution]}
      - {slug: jfrog-pipelines, name: JFrog Pipelines, segments: [cicd]}
    sources:
      - {name: JFrog Blog, url: https://jfrog.com/blog/feed/, kind: official, fetch_method: rss, is_active: false}
      - {name: JFrog GitHub, url: https://github.com/jfrog, kind: github, fetch_method: github, options: {repos: [jfrog-cli, frogbot, jfrog-cli-security]}, is_active: false}
      - {name: JFrog Pricing, url: https://jfrog.com/pricing/, kind: official, fetch_method: page_diff, is_active: false}

