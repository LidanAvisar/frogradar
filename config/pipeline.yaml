# Pipeline stage settings (embed, dedup). Validated by app/core/catalog.py (PipelineFile).
# Thresholds are cosine similarity (1 = identical). Calibrate with `make dedup-report`.

embedding:
  # Embedding input = title + the first max_chars characters of raw_text.
  max_chars: 2000
  batch_size: 64        # texts per embed() call (the gateway caches each text separately)

dedup:
  window_days: 14       # only signals published within ±window_days can be duplicates
  # A signal joins a cluster only if its similarity to the cluster's canonical signal reaches:
  cross_source_threshold: 0.85   # ...when they come from different sources
  same_source_threshold: 0.97    # ...when from the same source (templated changelog entries
                                 #    look alike but are different news)
  neighbours: 10        # nearest neighbours fetched per signal (HNSW)

llm:
  max_workers: 4        # parallel LLM calls per stage (bounded thread pool)

# Characters of raw_text sent to each LLM stage (raw_text is untrusted input, see README).
triage:
  max_chars: 3000       # relevance gate: the lead is enough
enrich:
  max_chars: 12000      # the verifier gets the same text, so it checks exactly what the writer saw
  quote_retries: 1      # extra attempt when evidence_quote is not verbatim in the source
  # Near-miss quote → replaced by the real span (1 sentence or 2 adjacent ones) when difflib
  # similarity AND coverage of the quote are both >= this; no retry needed (D39).
  quote_repair_threshold: 0.9
verify:
  max_chars: 12000

# Confidence = how faithfully the signal reflects what its source says (not whether the source's
# claim is true; vendor claims are flagged by is_claim instead). Computed in code, no LLM:
#   confidence = w.verification*V + w.trust*T + w.corroboration*C + w.evidence*E, then caps
#   V = verification_values[verdict]   T = source trust_score   E = 1 if the quote is verbatim
#   C = min(1, (sources in dedup cluster - 1) / (corroboration_full_at - 1))
score:
  weights: {verification: 0.45, trust: 0.25, corroboration: 0.15, evidence: 0.15}   # sum to 1
  verification_values: {supported: 1.0, partial: 0.5, unsupported: 0.0}
  corroboration_full_at: 3
  no_source_trust: 0.5
  caps: {unsupported: 0.30, quote_unverified: 0.60}
  bands: {high: 0.75, medium: 0.50}    # >= high → high, >= medium → medium, else low

# Page diff watcher (fetch_method page_diff) and its Wayback Machine baseline (D40, D41).
# Text = trafilatura extraction (or options.selector), normalized line by line.
page_diff:
  min_text_chars: 500       # extracted text shorter than this = JS shell / error page: no snapshot
  short_line_chars: 30      # consecutive lines shorter than this are joined ("$" "19" "per user")
  min_changed_chars: 40     # changed non-whitespace chars below this = noise (unless a price line changed)
  restructure_ratio: 0.5    # changed lines / all lines above this = redesign: no normal signal
  context_lines: 1          # unchanged lines shown around each change
  max_diff_chars: 12000     # diff text cap (= enrich.max_chars, so the model sees all of it)
  # Removed from every line before comparing (case-insensitive). Never touch prices.
  noise_patterns:
    - '\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.? \d{1,2},? \d{4}\b'
    - '\b\d{1,2} (?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]* \d{4}\b'
    - '\b\d{4}-\d{2}-\d{2}(?:t[\d:.]+z?)?\b'
    - '(?:©|\(c\)|copyright)\s*(?:\d{4}\s*[-–]\s*)?\d{4}'
    - '\b\d+ (?:seconds?|minutes?|hours?|days?|weeks?|months?) ago\b'
  # Lines dropped entirely (case-insensitive): cookie banners, consent, newsletter boxes.
  drop_line_patterns:
    - '\bcookies?\b'
    - '\b(?:privacy|consent) (?:preferences|settings|choices)\b'
    - '^(?:skip to (?:main )?content|back to top|sign in|sign up|log in)$'
  # A line states a price or a plan limit (used for the price-only diff after a redesign).
  price_patterns:
    - '[$€£]\s?\d'
    - '\b\d[\d,.]*\s?(?:usd|eur|gbp)\b'
    - '\b(?:usd|eur|gbp)\s?\d'
    - '\bper (?:user|seat|month|year|developer|committer|contributor|gb)\b'
    - '/\s?(?:user|seat|mo|month|yr|year|gb)\b'
    - '\b(?:starting at|contact sales|custom pricing)\b'
  wayback:
    target_days_ago: [365, 182, 91]   # ~12, 6 and 3 months back
    window_days: 31         # nearest capture must be within this many days of the target
    host_delay_s: 5.0       # >= 5 s between requests to web.archive.org
    min_length_ratio: 0.5   # archived text < 50% of today's length = rendered differently: skip
