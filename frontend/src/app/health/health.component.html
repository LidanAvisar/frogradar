<mat-card class="health-card">
  <mat-card-header>
    <mat-card-title>System status</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (loading()) {
      <mat-spinner diameter="32" />
    } @else {
      @if (health(); as h) {
        <mat-chip-set>
          <mat-chip [class.bad]="h.status !== 'ok'">API: {{ h.status }}</mat-chip>
          <mat-chip [class.bad]="h.db !== 'connected'">DB: {{ h.db }}</mat-chip>
        </mat-chip-set>
      } @else {
        <p class="error">{{ error() }}</p>
      }
    }
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="refresh()" [disabled]="loading()">Refresh</button>
  </mat-card-actions>
</mat-card>
